<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TitleBuzz</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div>
            <div class="brand">TitleBuzz</div>
            <div class="publisher">Turbo Studios</div>
        </div>
        <div class="badge">WHISPER</div>
    </header>

    <main>
        <section class="card">
            <div class="section-title">1. Audio / Video</div>
            <div class="row">
                <button id="browseMedia" class="button primary">Choose Media</button>
                <div id="mediaName" class="file-name">No file selected</div>
            </div>
            <div id="mediaPath" class="muted path"></div>
        </section>

        <section class="card grid2">
            <div>
                <label for="model">Model</label>
                <select id="model">
                    <option value="tiny">Tiny — fastest</option>
                    <option value="base" selected>Base — balanced</option>
                    <option value="small">Small — better accuracy</option>
                    <option value="medium">Medium — high accuracy</option>
                    <option value="large-v3">Large-v3 — best quality</option>
                </select>
            </div>
            <div>
                <label for="language">Language</label>
                <select id="language">
                    <option value="">Auto detect</option>
                    <option value="bn">Bangla</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="ur">Urdu</option>
                    <option value="ar">Arabic</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="zh">Chinese</option>
                    <option value="eo">Esperanto</option>
                </select>
            </div>
        </section>

        <section class="card">
            <div class="section-title">2. Python</div>
            <div class="row">
                <input id="pythonPath" type="text" placeholder="python.exe path, or 'python'">
                <button id="browsePython" class="button secondary">Browse</button>
            </div>
            <div class="hint">Use a Python installation where openai-whisper is installed.</div>
        </section>

        <section class="card">
            <div class="section-title">3. Transcribe</div>
            <button id="transcribe" class="button transcribe">Transcribe</button>
            <button id="cancel" class="button danger hidden">Cancel</button>
            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="status" class="status">Ready.</div>
        </section>

        <section class="card result-card">
            <div class="result-head">
                <div class="section-title">Transcript</div>
                <div id="detected" class="detected"></div>
            </div>
            <textarea id="result" spellcheck="false" placeholder="Your transcript will appear here..."></textarea>
            <div class="actions">
                <button id="copy" class="button secondary">Copy</button>
                <button id="saveTxt" class="button secondary">Save TXT</button>
                <button id="saveSrt" class="button secondary">Save SRT</button>
            </div>
        </section>
    </main>

    <footer>TitleBuzz 1.0.0 · Turbo Studios · Local Whisper transcription</footer>
</div>

<script src="./CSInterface.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
